
<ion-app>

  <ion-split-pane contentId="main-content" when="md">

    <ion-menu
      menuId="first-menu"
      contentId="main-content"
      side="start"
      type="overlay">

      <ion-header>
        <ion-toolbar color="dark">
          <ion-icon slot="start" name="sparkles-outline" size="large"></ion-icon>
          <ion-title>AdaSalon</ion-title>
        </ion-toolbar>

        <ion-toolbar color="dark">
          <ion-title size="small">Gestión de salón de belleza</ion-title>
        </ion-toolbar>
      </ion-header>

      <ion-content>
        <ion-list>

          <ion-item button detail="false" (click)="navegar('/home')">
            <ion-icon slot="start" name="home-outline"></ion-icon>
            <ion-label>Inicio</ion-label>
          </ion-item>

          <ion-item button detail="false" (click)="navegar('/clientes')">
            <ion-icon slot="start" name="people-outline"></ion-icon>
            <ion-label>Clientes</ion-label>
          </ion-item>

          <ion-item button detail="false" (click)="navegar('/productos')">
            <ion-icon slot="start" name="cube-outline"></ion-icon>
            <ion-label>Productos</ion-label>
          </ion-item>

        </ion-list>
      </ion-content>

    </ion-menu>

    <ion-router-outlet id="main-content"></ion-router-outlet>

  </ion-split-pane>

</ion-app>
