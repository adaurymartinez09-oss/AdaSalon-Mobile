
<ion-header>
  <ion-toolbar color="dark">
    <ion-buttons slot="start">
      <ion-menu-button autoHide="false"></ion-menu-button>
    </ion-buttons>

    <ion-title>AdaSalon</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <div class="welcome">
    <p>BIENVENIDO A</p>
    <h1>AdaSalon</h1>
    <h3>Hola, {{ nombreUsuario }}</h3>
    <p>Control de tu salón de belleza</p>
  </div>

  <div class="section-title">
    Resumen del negocio
  </div>

  <ion-grid>
    <ion-row>
      <ion-col size="6">
        <ion-card class="dashboard-card">
          <ion-card-header>
            <ion-card-title>Clientes</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <h2>{{ totalClientes }}</h2>
            <p>Registrados</p>
          </ion-card-content>
        </ion-card>
      </ion-col>

      <ion-col size="6">
        <ion-card class="dashboard-card">
          <ion-card-header>
            <ion-card-title>Productos</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <h2>{{ totalProductos }}</h2>
            <p>En inventario</p>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>

  <ion-card class="sales-card">
    <ion-card-header>
      <ion-card-title>Ventas del día</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <h1>RD$ {{ ventasDelDia | number }}</h1>
      <p>Resumen de ventas</p>
    </ion-card-content>
  </ion-card>

</ion-content>
